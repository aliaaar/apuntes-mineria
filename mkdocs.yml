site_name: Apuntes de Ingeniería en Minas
site_description: Tutoriales paso a paso con teoría de los ramos de Ingeniería en Minas (UNAB).
site_url: https://aliaaar.github.io/apuntes-mineria/
repo_url: https://github.com/aliaaar/apuntes-mineria
repo_name: aliaaar/apuntes-mineria

docs_dir: docs

theme:
  name: material
  language: es
  icon:
    logo: material/pickaxe
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: es
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.mark

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - ICMI222 · Evaluación de yacimientos:
      - icmi222/index.md
      - Tutoriales:
          - Lab · Modelo de bloques, dominios y estimación ID2: icmi222/lab-modelo-bloques-id2.md
      - Apuntes de clase:
          - PPT 00 · Presentación del curso: icmi222/clases/00-presentacion.md
          - PPT 01 · Introducción a la geoestadística: icmi222/clases/01-introduccion.md
          - PPT 02 · AED I, estadísticas y gráficos: icmi222/clases/02-aed-estadisticas-basicas.md
          - PPT 03 · AED II, de la descripción a la decisión: icmi222/clases/03-aed-decisiones.md
          - PPT 04 · Variable regionalizada y función aleatoria: icmi222/clases/04-variable-regionalizada.md
          - PPT 05 · Dominios, contactos y compositación: icmi222/clases/05-dominios-compositacion.md
          - PPT 06 · Variograma experimental: icmi222/clases/06-variograma-experimental.md
          - PPT 07 · Modelamiento de variogramas: icmi222/clases/07-modelamiento-variogramas.md
      - Cuaderno de clases:
          - Semana 1 · Inicio del curso: icmi222/cuaderno/01-inicio.md
          - Semana 2 · Geoestadística, sondajes y QA/QC: icmi222/cuaderno/02-geoestadistica-qaqc.md
          - Semana 3 · AED en Vulcan: icmi222/cuaderno/03-aed-vulcan.md
          - Semana 4 · AED bivariado: icmi222/cuaderno/04-aed-bivariado.md
          - Semana 6 · Fundamentos de geoestadística: icmi222/cuaderno/06-fundamentos.md
          - Semana 6 · Lab modelo de bloques e ID: icmi222/cuaderno/06-lab-modelo-bloques.md
          - Semana 7 · Dominios y compositación: icmi222/cuaderno/07-dominios-compositacion.md
          - Semana 8 · Variograma experimental: icmi222/cuaderno/08-variograma.md
          - Semana 9 · Modelamiento variográfico: icmi222/cuaderno/09-modelamiento.md
          - Resumen de conceptos: icmi222/cuaderno/10-resumen.md
  - Glosario: glosario.md
  - Etiquetas: etiquetas.md
  - Cómo agregar un tutorial: como-agregar.md
